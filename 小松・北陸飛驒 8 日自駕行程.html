<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小松・北陸飛驒 8 日自駕行程 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--sun:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;--line:3px solid var(--ink);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--paper);border-bottom:var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px}
nav b{font-size:17px;white-space:nowrap}
nav div{display:flex;gap:6px;overflow-x:auto}
nav a{color:var(--ink);text-decoration:none;border:var(--line);border-radius:999px;padding:1px 12px;font-size:14px;white-space:nowrap;background:#fff}
nav a:nth-child(1){background:var(--sun)}nav a:nth-child(2){background:var(--sky)}nav a:nth-child(3){background:var(--green)}nav a:nth-child(4){background:var(--coral)}
main{max-width:680px;margin:0 auto;padding:16px 14px 48px}
section{margin-top:34px}
h1{font-size:28px;line-height:1.3;margin:14px 0 4px}
h2{font-size:22px;margin:0 0 12px;display:inline-block;background:var(--sun);border:var(--line);border-radius:999px;padding:0 16px}
.card{background:#fff;border:var(--line);border-radius:24px;padding:14px 16px}
.hero svg{display:block;width:100%;height:auto;border:var(--line);border-radius:28px;background:var(--paper)}
.sub{margin:0 0 10px;font-size:15px}
.count{display:inline-flex;align-items:baseline;gap:6px;background:var(--coral);border:var(--line);border-radius:999px;padding:2px 18px}
.count b{font-size:30px;line-height:1.2}
.tk{display:grid;gap:12px}
.tk .card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.stamp{grid-row:span 2;border:var(--line);border-radius:18px;padding:4px 12px;text-align:center;background:var(--sky);font-size:15px;line-height:1.4}
.tk .card:nth-child(2) .stamp{background:var(--green)}
.tk p{margin:0;font-size:15px}.tk .big{font-size:18px}
.note{font-size:13px;opacity:.75;margin:8px 4px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px}
.tabs button{font:inherit;color:var(--ink);flex:none;border:var(--line);border-radius:18px;background:#fff;padding:2px 12px;line-height:1.35;cursor:pointer;text-align:center;transition:transform .2s}
.tabs button small{display:block;font-size:12px}
.tabs button[aria-selected=true]{background:var(--coral);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
button:focus-visible,a:focus-visible,input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.9) translateY(14px);opacity:.2}100%{transform:none;opacity:1}}
.dh{background:var(--sky);border:var(--line);border-radius:24px;padding:10px 16px;margin-bottom:14px}
.dh h3{margin:0;font-size:19px}.dh p{margin:0;font-size:14px}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px dashed var(--ink);margin-left:10px}
.tl li{position:relative;margin-bottom:12px;background:#fff;border:var(--line);border-radius:20px;padding:8px 14px}
.tl li::before{content:"";position:absolute;left:-36px;top:16px;width:16px;height:16px;border:var(--line);border-radius:50%;background:var(--paper)}
.tl li.must::before{background:var(--coral)}
.tl li.sep{background:var(--sun);padding:2px 14px;font-size:14px}
.tl li.sep::before{background:var(--sun)}
.tm{font-size:13px;opacity:.8}
.tl .nm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag,.must-b{font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 9px;line-height:1.6}
.must-b{background:var(--coral);animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}92%{transform:rotate(6deg)}}
.eat{margin-top:6px;background:var(--green);border:var(--line);border-radius:20px;padding:8px 14px;font-size:14px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo label{display:flex;gap:12px;align-items:center;background:#fff;border:var(--line);border-radius:18px;padding:6px 14px;cursor:pointer}
.todo input{position:absolute;opacity:0}
.todo span.bx{flex:none;width:26px;height:26px;border:var(--line);border-radius:9px;background:var(--paper);display:grid;place-items:center;transition:background .2s,transform .2s}
.todo input:checked+span.bx{background:var(--green);transform:scale(1.12)}
.todo input:checked+span.bx::after{content:"";width:6px;height:12px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(40deg) translate(-1px,-1px)}
.todo input:checked~.tx{text-decoration:line-through;opacity:.55}
.stay{display:grid;gap:12px}
.stay .card b{font-size:18px}.stay p{margin:0;font-size:14px}
.stay .card:nth-child(1){background:var(--sky)}.stay .card:nth-child(2){background:var(--sun)}.stay .card:nth-child(3){background:var(--green)}.stay .card:nth-child(4){background:var(--coral)}
.nt{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:#fff;font-size:13px}
footer{text-align:center;font-size:13px;opacity:.7;margin-top:30px}
.cl{animation:drift 26s linear infinite}.cl2{animation:drift 38s linear infinite;animation-delay:-14s}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(450px)}}
.pl{animation:fly 22s linear infinite}
@keyframes fly{from{transform:translateX(-70px)}to{transform:translateX(430px)}}
.car{animation:drive 16s linear infinite}.car g{animation:bob .5s ease-in-out infinite alternate}
@keyframes drive{from{transform:translateX(-70px)}to{transform:translateX(430px)}}
@keyframes bob{to{transform:translateY(-2px)}}
.sn{animation:fall 7s linear infinite}
@keyframes fall{from{transform:translateY(-10px)}to{transform:translateY(190px)}}
.sun{animation:sway 5s ease-in-out infinite alternate;transform-origin:300px 48px}
@keyframes sway{to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav><b>北陸小旅行</b><div><a href="#plan">行程</a><a href="#flight">航班</a><a href="#todo">待辦</a><a href="#stay">住宿</a></div></nav>
<main>

<path d="M0 150L70 70 120 120 190 50 270 135 320 95 360 130V210H0Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>

<rect x="124" y="148" width="60" height="32" rx="4" fill="#FFFCF6"/><path d="M108 156L154 96 200 156Z" fill="#F6D27A"/><path d="M154 96L138 118 154 112 170 118Z" fill="#fff"/><rect x="146" y="158" width="16" height="22" rx="8" fill="#F2A497"/><circle cx="134" cy="160" r="5" fill="#A8D3E6"/><circle cx="174" cy="160" r="5" fill="#A8D3E6"/></g>

<g fill="#fff" stroke="#3E3A39" stroke-width="1.5"><circle class="sn" cx="30" cy="10" r="3.5"/><circle class="sn" style="animation-delay:-2s" cx="90" cy="20" r="3"/><circle class="sn" style="animation-delay:-4s" cx="150" cy="0" r="3.5"/><circle class="sn" style="animation-delay:-1s" cx="215" cy="14" r="3"/><circle class="sn" style="animation-delay:-5s" cx="280" cy="4" r="3.5"/><circle class="sn" style="animation-delay:-3s" cx="335" cy="16" r="3"/></g>
</svg>
<h1>小松出發・北陸飛驒雪見自駕 8 日</h1>
<p class="sub">2027/2/28（日）– 3/7（日）｜富山・犬山・高山・白川鄉・金澤</p>
<div class="count" aria-live="polite"><span id="cdl">出發倒數</span><b id="cd">–</b><span id="cdu">天</span></div>
</header>

<section id="flight">
<h2>航班</h2>
<div class="tk">
<div class="card"><div class="stamp">去程<br>2/28 日</div><p class="big">抵達小松機場</p><p>12:00–13:00 入境 → 13:30 租車</p></div>
<div class="card"><div class="stamp">回程<br>3/7 日</div><p class="big">小松機場起飛</p><p>11:00 還車 → 13:00 飛機</p></div>
</div>
<p class="note">機票預估每人 NT$14,782。航班編號與航空公司尚未填入。</p>
</section>

<section id="plan">

<div class="tabs" id="tabs" role="tablist" aria-label="選擇日期"></div>
<div id="day" role="tabpanel"></div>
</section>

<section id="todo">
<h2>出發前待辦</h2>

</section>

<section id="stay">
<h2>住宿</h2>
<div class="stay" id="stayl"></div>
</section>
<footer>行程資料：2027 小松路線 2 ｜ 路線 A／B 依當天時間彈性選擇</footer>
</main>

{d:'3/2 二',n:'犬山 → 高山',h:'東急 stay 飛驒高山 結之湯',e:'早餐 飯店｜晚餐 Shabu Shabu no Hidaji／Suzuya Restaurant',i:[

{d:'3/3 三',n:'新穗高纜車',h:'東急 stay 飛驒高山 結之湯（續住）',e:'早餐 飯店｜午餐 平湯休息站',i:[
